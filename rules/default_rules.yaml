# ==============================================================================
# High-Precision Deterministic Security Rules — Action x Target Grammar
# ==============================================================================
# Provenance: System Prompts & Agent Architectures Intelligence Analysis
# License-Compliant Pattern Formulations (No copyrighted prompt bodies included).
#
# Rules enforce Action x Target co-occurrence to eliminate False Positives:
#   - Action (reveal, dump, print, ignore, override) + Target (system prompt, tool schemas)
#   - Benign queries (e.g. "What is a system prompt?") are strictly allowed (NORMAL).
# ==============================================================================

rules:

  # --- Action x Target: System Prompt & Internal Instructions Extraction ---
  - id: SEC-RULE-001
    name: system_prompt_extraction_action_target
    category: security
    type: regex
    severity: high
    source: "System Prompts & Agent Architectures Intelligence (Action x Target)"
    version: 2.1
    description: "Detects extraction actions targeting system prompts, hidden developer rules, and tool schemas"
    patterns:
      - "(?i)\\b(?:reveal|expose|output|print|dump|repeat|reconstruct|translate|summarize|give\\s+me|show\\s+me|display)\\b.*\\b(?:prompt|instructions|rules|guidelines|configuration|directives|system\\s+message|tool\\s+definitions?|function\\s+schemas?)\\b"
      - "(?i)(?:what\\s+are|what\\s+is)\\s+(?:all\\s+)?your\\s+(?:hidden\\s+|initial\\s+|original\\s+|developer\\s+|system\\s+)+(?:prompt|instructions|rules|config|configuration|tool\\s+definitions?)"
      - "(?i)\\b(?:اعرض|اطبع|استخرج|كرر|ترجم|لخص|أعطني|اعطني|اكشف)\\b.*\\b(?:تعليمات|موجه|برومبت|أوامر|اوامر|قواعد|توجيهات|تعريفات\\s+الأدوات|تعريفات\\s+الادوات)\\b"
      - "(?i)(?:ما\\s+هي)\\s+(?:تعليماتك|توجيهاتك|أوامرك|اوامرك)\\s+(?:الأولية|الاولية|السرية|المخفية|الخاصة\\s+بالمطور)"

  # --- Action x Target: Direct Instruction Override & Restriction Removal ---
  - id: SEC-RULE-002
    name: instruction_override_action_target
    category: security
    type: regex
    severity: high
    source: "Adversarial Ingress Research"
    version: 2.1
    description: "Detects action verbs to ignore, drop, or override system constraints and safety boundaries"
    patterns:
      - "(?i)(?:^|[\n;.!?])\\s*(?:please\\s+)?(?:ignore|disregard|forget|override|bypass|drop|disable|deactivate)\\s+(?:all\\s+)?(?:your|the|previous|prior|system)?\\s+(?:instructions|rules|guidelines|constraints|safety|filters|boundaries|directives)"
      - "(?i)(?:^|[\n;.!?])\\s*(?:تجاهل|الغ|ألغ|اسقط|أسقط|تجاوز|عطل|تعطيل)\\s+(?:كل|جميع|كافة)?\\s+(?:الـ?)?(?:تعليمات|قواعد|قيود|توجيهات|فلاتر|حماية)\\s*(?:السابقة|الأصلية|الاصلية|المفروضة)?"
      - "(?i)(?:new\\s+instructions?:|system\\s+override:|admin\\s+override:|priority\\s+instruction:)\\s*"

  # --- Action x Target: Persona Hijack & Unrestricted Developer Modes ---
  - id: SEC-RULE-003
    name: persona_hijack_mode
    category: security
    type: regex
    severity: high
    source: "Jailbreak Archetypes Analysis"
    version: 2.1
    description: "Detects explicit persona switches to unrestricted entities (DAN, Developer Mode, Sudo Mode)"
    patterns:
      - "(?i)(?:you\\s+are\\s+now|switch\\s+to|act\\s+as|pretend\\s+to\\s+be|enable)\\s+(?:DAN|developer\\s+mode|god\\s+mode|sudo\\s+mode|jailbreak\\s+mode|unrestricted\\s+mode)"
      - "(?i)(?:pretend|act\\s+as\\s+if|behave\\s+like)\\s+you\\s+have\\s+(?:no\\s+restrictions|no\\s+rules|no\\s+limits|no\\s+filters|broken\\s+free)"
      - "(?i)(?:أنت\\s+الآن|تصرف\\s+كـ|تظاهر\\s+أنك)\\s+(?:بدون\\s+قيود|في\\s+وضع\\s+المطور|DAN|بدون\\s+أي\\s+فلاتر)"

  # --- Structural Signal: Delimiter & System Role Injection ---
  - id: SEC-RULE-004
    name: structural_delimiters_injection
    category: security
    type: regex
    severity: high
    source: "Multi-Tool Delimiter Audit (Cursor/Claude/LLaMA/ChatML)"
    version: 2.1
    description: "Detects active structural delimiter blocks forging system roles or injection containers"
    patterns:
      - "(?i)<(system-reminder|tool_calling|tools|anthropic_thinking_protocol)>\\s*.*?</\\1>"
      - "(?i)<\\|im_start\\|>(?:system|assistant|admin)\\b"
      - "(?i)\\[INST\\].*?\\[/INST\\]|<<\\s*SYS\\s*>>"

  # --- Deterministic: Target Hacking & Unauthorized Cyber Access ---
  - id: SEC-RULE-005
    name: cyber_attack_targets
    category: harmful
    type: regex
    severity: high
    source: "Threat Intelligence & Cyber Safety"
    version: 2.1
    description: "Detects explicit requests to hack, breach, or compromise companies, servers, or databases"
    patterns:
      - "(?i)(?:اريد|أريد|كيف|طريقة|ساعدني\\s+في|علمني\\s+كيف)\\s+(?:اختراق|تهكير|سرقة|تخريب)"
      - "(?i)\\b(?:اختراق|تهكير)\\s+(?:شركة|شركات|موقع|مواقع|سيرفر|سيرفرات|خادم|خوادم|نظام|أنظمة|حساب|حسابات|شبكة|شبكات|بنك|بنوك|مؤسسة|مؤسسات|قاعدة\\s+بيانات)"
      - "(?i)\\b(?:hack|breach|infiltrate|penetrate)\\s+(?:into\\s+)?(?:a\\s+|the\\s+)?(?:company|corporation|bank|server|database|network|account|target|infrastructure)"

  # --- Roleplay Sandbox & Virtual Root Extraction ---
  - id: SEC-RULE-006
    name: roleplay_sandbox_terminal
    category: security
    type: regex
    severity: high
    source: "Container Simulation & Red Team Research"
    version: 2.1
    description: "Detects roleplay simulation of unrestricted terminals and shadow/credential dumping"
    patterns:
      - "(?i)(?:roleplay|roleplaying|sandbox|simulate|pretend)\\b.*\\b(?:root\\s+terminal|unrestricted|cat\\s+/etc/shadow|dump\\s+admin|bash\\s+terminal)"
      - "(?i)(?:cat\\s+/etc/shadow|/etc/passwd|dump.*credentials|dump.*hashes)"
      - "(?i)(?:كاتب\\s+روايات|رواية\\s+بوليسية|قصة\\s+خيالية)\\b.*\\b(?:اختراق|سرقة\\s+قاعدة|تعطيل\\s+جدار|تهكير)"

  # --- Urgent Authority & Credential Phishing ---
  - id: SEC-RULE-007
    name: urgent_credential_phishing
    category: privacy
    type: regex
    severity: high
    source: "Social Engineering & Phishing Analysis"
    version: 2.1
    description: "Detects emergency authority spoofing and urgent demands for database passwords and API keys"
    patterns:
      - "(?i)(?:عاجل|طارئ|ضروري)\\b.*\\b(?:مدير|مسؤول|خادم\\s+الإنتاج)\\b.*\\b(?:كلمة\\s+مرور|مفتاح\\s+(?:الـ?)?API|قاعدة\\s+البيانات)"
      - "(?i)(?:urgent|emergency)\\b.*\\b(?:admin|production\\s+server|infrastructure)\\b.*\\b(?:password|api\\s+key|database\\s+credentials)"

  # --- Deterministic: Dangerous System & Subprocess Execution ---
  - id: SEC-RULE-008
    name: dangerous_execution
    category: security
    type: regex
    severity: high
    source: "OS Shell Injection Rules"
    version: 2.1
    description: "Detects direct operating system execution commands (exec, eval, os.system, subprocess)"
    patterns:
      - "(?i)(?:subprocess\\.run|subprocess\\.Popen|os\\.system|exec\\s*\\(|eval\\s*\\(|shutil\\.rmtree|pty\\.spawn)"
      - "(?i)(?:powershell(?:\\.exe)?\\s+-enc|cmd\\.exe\\s+/c|/bin/sh|/bin/bash)"
      - "(?i)rm\\s+-rf\\s+/"
