version: "3.9"

services:
  # =============================================================
  # 1. AI Gateway (Ingress Layer) — AI Risk Assessment Gateway
  # Only service exposed to external clients (Port 8000)
  # =============================================================
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: secure_ai_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - GATEWAY_API_KEYS=sk-test-key-1,sk-test-key-2
      - RATE_LIMIT_PER_MINUTE=60
      - NORMAL_BACKEND_URL=https://generativelanguage.googleapis.com
      - NORMAL_BACKEND_API_KEY=${NORMAL_BACKEND_API_KEY:-}
      - NORMAL_BACKEND_MODEL=gemini-2.5-flash
      - SHIELD_SERVICE_URL=http://shield:8001
      - RULES_DIR=/app/rules
      - LOG_LEVEL=INFO
    volumes:
      - ./rules:/app/rules:ro
      - ./policy/policies.json:/app/policy/policies.json:ro
    networks:
      - frontend_net
      - backend_net
      - shield_internal_net
    depends_on:
      shield:
        condition: service_healthy

  # =============================================================
  # 2. Shield Service (Local Judge & sofa-shield-fast)
  # Air-Gapped: Zero egress, Read-Only rootfs, Dropped Caps, No DNS
  # =============================================================
  shield:
    build:
      context: .
      dockerfile: docker/Dockerfile.shield
    container_name: secure_ai_shield
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64M,mode=1777
    dns:
      - 127.0.0.1
    environment:
      - SHIELD_HOST=0.0.0.0
      - SHIELD_PORT=8001
      - SHIELD_LOCAL_LLM_URL=http://local_llm:8000/v1
      - SHIELD_LOCAL_LLM_MODEL=meta-llama/Meta-Llama-3-8B-Instruct
      - SHIELD_CIRCUIT_BREAKER_THRESHOLD=3
      - SHIELD_CIRCUIT_BREAKER_RECOVERY=30
      - SHIELD_LOG_LEVEL=INFO
    networks:
      - shield_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # =============================================================
  # 3. Local LLM Runtime (vLLM / Air-Gapped Engine)
  # Strictly Air-gapped on internal network with ZERO internet routing
  # =============================================================
  local_llm:
    image: vllm/vllm-openai:latest
    container_name: secure_ai_local_llm
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    dns:
      - 127.0.0.1
    command: >
      --model /models/Meta-Llama-3-8B-Instruct
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.90
      --max-model-len 4096
    volumes:
      - ./models:/models:ro
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    networks:
      - shield_internal_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
            - count: all
              capabilities: [gpu]

# =============================================================
# Network Isolation Architecture (Air-Gapped SR-2 / SR-3)
# =============================================================
networks:
  # Public ingress for client traffic
  frontend_net:
    driver: bridge

  # Normal egress flow to approved Cloud AI
  backend_net:
    driver: bridge

  # STRICTLY AIR-GAPPED: internal: true guarantees ZERO internet egress routing
  shield_internal_net:
    driver: bridge
    internal: true
