# ==============================================================================
# Multi-Turn Quoted Execution Patterns
# ==============================================================================
# Detects commands that instruct the LLM to execute or apply previously quoted attacks.
# ==============================================================================

version: "1.0"

patterns:
  - id: CTX-EXEC-001
    description: "Arabic execution commands targeting quoted attacks"
    pattern: '(?i)\b(?:طبقها|نفذها|الآن\s+نفذ|نفذ\s+الجملة|طبق\s+المثال)\b'

  - id: CTX-EXEC-002
    description: "English execution commands targeting quoted attacks"
    pattern: '(?i)\b(?:apply\s+it|execute\s+it|now\s+run\s+it|run\s+it\s+now|do\s+it\s+now|follow\s+the\s+quote)\b'
