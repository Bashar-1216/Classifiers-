version: "1.0"
bundle_name: "enterprise_security_knowledge"
description: "Central catalog and manifest for all security configurations, threat rules, lexicons, exclusions, probing terms, and DLP patterns"

sources:
  ingress_default:
    path: "rules/default.yaml"
    format: "yaml"
    required: true
    description: "Core deterministic Action x Target threat detection rules (SEC-RULE-001 to SEC-RULE-010)"

  ingress_custom:
    path: "rules/custom.yaml"
    format: "yaml"
    required: false
    description: "Enterprise and organization-specific custom threat rules"

  output_policy:
    path: "rules/output_policy.yaml"
    format: "yaml"
    required: false
    description: "Declarative output safety, directive leakage, and payload rules"

  safety_rules:
    path: "rules/safety.yaml"
    format: "yaml"
    required: false
    description: "Declarative safety rules (hate speech, violence, illegal activities, cyber abuse, social engineering)"

  adversarial_lexicon:
    path: "lexicons/adversarial.json"
    format: "json"
    required: true
    description: "Multilingual adversarial vocabulary and threat phrases for BM25 and lexical scoring"

  benign_lexicon:
    path: "lexicons/benign.json"
    format: "json"
    required: true
    description: "Multilingual benign and educational vocabulary for false-positive reduction"

  benign_exclusions:
    path: "exclusions/benign.yaml"
    format: "yaml"
    required: true
    description: "Adjudication patterns for meta-analysis, quotes, educational inquiries, and game scenarios"

  active_overrides:
    path: "exclusions/active_overrides.yaml"
    format: "yaml"
    required: true
    description: "Embedded active malicious command patterns that cancel benign exclusions"

  context_probing:
    path: "context/probing_terms.json"
    format: "json"
    required: true
    description: "Multilingual security terms used to detect multi-turn Salami and cumulative probing"

  context_execution:
    path: "context/execution_patterns.yaml"
    format: "yaml"
    required: true
    description: "Patterns that command execution of previously quoted text across turns"

  dlp_pii:
    path: "dlp/pii_patterns.yaml"
    format: "yaml"
    required: true
    description: "PII candidate extraction patterns with associated validation requirements (e.g., Luhn, IBAN)"

  dlp_secrets:
    path: "dlp/secret_patterns.yaml"
    format: "yaml"
    required: true
    description: "Secret and API key candidate extraction patterns (OpenAI, AWS, GitHub, JWT, Private Keys)"

  semantic_anchors:
    path: "semantic/risk_anchors.json"
    format: "json"
    required: true
    description: "Semantic category anchors and canonical intent prototypes for contrastive vector classification"

  adversarial_sequences:
    path: "sequences/adversarial_flows.yaml"
    format: "yaml"
    required: false
    description: "Multi-token sequence ordering flows and structural injection vocabularies"

  metadata_modifiers:
    path: "metadata/risk_modifiers.yaml"
    format: "yaml"
    required: false
    description: "Role, data classification, and origin network risk modifiers and weights"

  inquiry_prefixes:
    path: "exclusions/inquiry_prefixes.json"
    format: "json"
    required: false
    description: "Educational and inquiry prefixes and boundary markers for false-positive reduction"

  morphological_roots:
    path: "lexicons/morphological_roots.json"
    format: "json"
    required: false
    description: "Subword roots for morphological distortion and elongation resilience"

  obfuscation_patterns:
    path: "statistical/obfuscation_patterns.yaml"
    format: "yaml"
    required: false
    description: "Zero-width and encoded payload statistical thresholds and patterns"

  multi_turn_rules:
    path: "context/multi_turn_rules.yaml"
    format: "yaml"
    required: false
    description: "Declarative multi-turn trajectory, quoted trap, and salami assembly rules"
