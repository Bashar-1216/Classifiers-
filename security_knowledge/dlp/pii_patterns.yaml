# ==============================================================================
# PII Candidate Detection Patterns
# ==============================================================================
# Defines candidate regex extraction patterns and required verification algorithm
# (e.g. none, luhn, iban_mod97)
# ==============================================================================

version: "1.0"

patterns:
  - id: DLP-PII-CREDIT-CARD
    category: pii_credit_card
    confidence: 0.95
    validation: luhn
    patterns:
      - '\b(?:\d{4}[-\s]){3}\d{4}\b'
      - '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|2(?:22[1-9]|2[3-9][0-9]|[3-6][0-9]{2}|7[01][0-9]|720)[0-9]{12}|3[47][0-9]{13})\b'

  - id: DLP-PII-IBAN
    category: pii_iban
    confidence: 0.90
    validation: iban_mod97
    patterns:
      - '\b[A-Za-z]{2}\d{2}[A-Za-z0-9\s-]{11,30}\b'

  - id: DLP-PII-SSN
    category: pii_ssn
    confidence: 0.85
    validation: none
    patterns:
      - '\b(?!(?:000|666|9))\d{3}-(?!00)\d{2}-(?!0000)\d{4}\b'

  - id: DLP-PII-EMAIL
    category: pii_email
    confidence: 0.70
    validation: none
    patterns:
      - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'

  - id: DLP-PII-PHONE
    category: pii_phone
    confidence: 0.65
    validation: none
    patterns:
      - '(?:\+|00)(?:966|971|20|962|964|961|1|44)[ \-\.]?[0-9]{7,12}\b|\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b'

  - id: DLP-PII-PRIVATE-IP
    category: pii_private_ip
    confidence: 0.50
    validation: none
    patterns:
      - '\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'

  - id: DLP-PII-CONTEXT-RECORD
    category: pii_structured_record
    confidence: 0.60
    validation: none
    patterns:
      - '(?i)(?:name|email|phone|address|ssn|dob|patient|customer|employee)\s*[:=]\s*\w+'
