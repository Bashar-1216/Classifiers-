# ==============================================================================
# Secret & API Key Candidate Detection Patterns
# ==============================================================================
# Defines candidate regex extraction patterns and required verification algorithm
# (e.g. entropy_and_diversity, known_prefix, strict_format)
# ==============================================================================

version: "1.0"

patterns:
  - id: DLP-SECRET-OPENAI
    category: secret_api_key
    confidence: 0.98
    validation: entropy_and_diversity
    prefix: "sk-"
    patterns:
      - '\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b'

  - id: DLP-SECRET-AWS
    category: secret_api_key
    confidence: 0.95
    validation: strict_format
    patterns:
      - '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{16}\b'

  - id: DLP-SECRET-GITHUB
    category: secret_api_key
    confidence: 0.98
    validation: strict_format
    patterns:
      - '\bghp_[A-Za-z0-9]{36}\b'

  - id: DLP-SECRET-JWT
    category: secret_token
    confidence: 0.90
    validation: strict_format
    patterns:
      - '\beyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*\b'

  - id: DLP-SECRET-PRIVATE-KEY
    category: secret_private_key
    confidence: 1.00
    validation: strict_format
    patterns:
      - '-----BEGIN (?:RSA |DSA |EC |PGP |OPENSSH )?PRIVATE KEY-----.*?-----END (?:RSA |DSA |EC |PGP |OPENSSH )?PRIVATE KEY-----'

  - id: DLP-SECRET-BEARER
    category: secret_token
    confidence: 0.85
    validation: none
    patterns:
      - '(?i)\bBearer\s+[A-Za-z0-9\-._~+/]+=*\b'

  - id: DLP-SECRET-GENERIC-ASSIGNMENT
    category: secret_credentials
    confidence: 0.80
    validation: entropy_and_diversity
    patterns:
      - '(?i)\b(?:password|pwd|secret_key|api_key|token)\s*[=:]\s*["'']?([a-zA-Z0-9!@#$%^&*()_+={}\[\]|\\:;""''''<>,.?/~`\-]{8,})["'']?\b'
