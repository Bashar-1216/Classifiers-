version: "1.0.0"
patterns:
  - id: DLP-CREDIT-CARD
    category: dlp_confirmed_credit_card
    validation: luhn
    pattern: '\b(?:\d[ -]*?){13,19}\b'
  - id: DLP-IBAN
    category: dlp_confirmed_iban
    validation: iban_mod97
    pattern: '\b[A-Za-z]{2}\d{2}[A-Za-z0-9\s-]{11,30}\b'
  - id: DLP-API-SECRET
    category: dlp_confirmed_api_secret
    validation: api_secret
    pattern: '\b(?:sk-(?:proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})\b'
