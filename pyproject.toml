[project]
name = "secure-ai-gateway"
version = "2.0.0"
description = "Enterprise AI Risk Assessment Gateway & Shield System - Ingress layer for AI services with multi-dimensional risk classification, policy enforcement, model routing, and post-generation output safety"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
gateway = "gateway.main:run"
shield = "shield.main:run"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "gateway*",
    "classifier*",
    "risk_engine*",
    "output_safety*",
    "policy*",
    "router*",
    "shield*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
