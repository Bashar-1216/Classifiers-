[project]
name = "secure-ai-risk-engine"
version = "2.0.0"
description = "Enterprise AI Risk Assessment & Policy Engine - Pure Python Security SDK for real-time prompt classification, policy enforcement, isolated local shield execution, and post-generation output safety"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[project.scripts]
risk-cli = "cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "classifier*",
    "risk_engine*",
    "output_safety*",
    "policy*",
    "router*",
    "shield*",
    "schemas*",
    "observability*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
